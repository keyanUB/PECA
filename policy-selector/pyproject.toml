[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-selector"
version = "0.1.0"
description = "OWASP SCP selection and refinement over MCP"
requires-python = ">=3.12"
dependencies = ["mcp>=1.30,<2", "openai>=2.0,<3", "pydantic>=2.11,<3", "httpx>=0.28,<1", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
policy-selector = "policy_selector.server:main"
policy-selector-client = "policy_selector.client:main"

[tool.setuptools.package-data]
policy_selector = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
